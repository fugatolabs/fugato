services:
  web:
    build: ./web
    environment:
      API_URL: http://api:3001
    ports:
      - "127.0.0.1::3000"
    volumes:
      - ./web/app:/app/app:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  api:
    build: ./api
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: postgres://sample:sample@db:5432/sample
    volumes:
      - ./api/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
