name: Go

on:
  push:
    paths: ['.github/workflows/go.yml', 'Makefile', 'requirements-test.txt', 'pyproject.toml', 'packages/fugato/**', 'tools/**', 'tests/tooling/**', 'docs/**', 'skills/**', 'third_party/**', 'THIRD_PARTY_NOTICES.md', 'LICENSE', 'NOTICE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/fugato/go.mod
          cache-dependency-path: packages/fugato/go.sum
      - run: make test-deps
      - run: make check
      - name: Fuzz preview Host parser
        working-directory: packages/fugato
        run: go test ./internal/fugato -run '^$' -fuzz '^FuzzPreviewHost$' -fuzztime=5s -parallel=2
      - name: Fuzz project configuration
        working-directory: packages/fugato
        run: go test ./internal/fugato -run '^$' -fuzz '^FuzzProjectConfig$' -fuzztime=5s -parallel=2
      - run: make vulnerabilities
