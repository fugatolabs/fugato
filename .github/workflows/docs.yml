name: Documentation export
on:
  pull_request:
  push:
    branches: [main]
    paths: ['Makefile', 'docs/**', 'tools/docs/**', 'tests/tooling/**', 'packages/fugato/**', 'skills/**', 'packages/cursor-extension/resources/fugato.schema.json', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/fugato/go.mod
          cache-dependency-path: packages/fugato/go.sum
      - run: make docs
