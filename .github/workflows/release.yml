name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/fugato/go.mod
          cache-dependency-path: packages/fugato/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/cursor-extension/package-lock.json
          package-manager-cache: false
      - name: Match release tag to version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' packages/fugato/internal/version/version.go)
          test "$RELEASE_TAG" = "v$version"
      - name: Test Go
        working-directory: packages/fugato
        run: go test -race -shuffle=on ./...
      - name: Test extension
        working-directory: packages/cursor-extension
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
      - name: Test agent setup and bundled skill
        run: |
          node --test scripts/test-setup-agent.mjs
          python3 scripts/sync-skill-references.py --check
          python3 scripts/test-export-website-docs.py
          python3 scripts/test-homebrew-formula.py
      - name: Assemble four binary targets and optional editor extension
        run: ./scripts/build-release.sh dist --extension
      - name: Check VSIX contents
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          package = next(pathlib.Path('dist').glob('*.vsix'))
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              for file in ('extension/LICENSE.txt', 'extension/NOTICE', 'extension/THIRD_PARTY_NOTICES.md', 'extension/out/extension.js'):
                  assert file in names, file
              assert not any('/node_modules/' in name for name in names)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugato-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugato-release-assets
          path: dist
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "Fugato $RELEASE_TAG" --notes-file docs/releases/0.0.1.md
