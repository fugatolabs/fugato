name: Release packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-goreleaser/**
      - .goreleaser.yaml
      - tools/release/**
      - install/**
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WITH_EXTENSION: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/fugato/go.mod
          cache-dependency-path: packages/fugato/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/cursor-extension/package-lock.json
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-test.txt
      - uses: ./.github/actions/setup-goreleaser
      - name: Match release tag to source version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' packages/fugato/internal/version/version.go)
          test "$RELEASE_TAG" = "v$version"
      - name: Verify source, generated files and extension
        run: make check vulnerabilities extension-check
      - name: Package tagged release without publishing
        if: startsWith(github.ref, 'refs/tags/')
        run: make release
      - name: Package local snapshot without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: make release-snapshot
      - name: Check and collect distributable assets
        run: |
          python3 - <<'PY'
          import pathlib, tarfile, zipfile
          for package in pathlib.Path('dist').glob('*.tar.gz'):
              root = package.name.removesuffix('.tar.gz')
              with tarfile.open(package) as archive:
                  names = set(archive.getnames())
                  for file in ('fugato', 'fugato-mcp', 'INSTALL.md', 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'):
                      assert f'{root}/{file}' in names, (package.name, file)
                  for directory in ('skills/fugato-workflow', 'third_party'):
                      for source in pathlib.Path(directory).rglob('*'):
                          if source.is_file():
                              assert archive.extractfile(f'{root}/{source.as_posix()}').read() == source.read_bytes(), (package.name, source)
          package = next(pathlib.Path('.release').glob('*.vsix'))
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              for file in ('extension/LICENSE.txt', 'extension/NOTICE', 'extension/THIRD_PARTY_NOTICES.md', 'extension/out/extension.js'):
                  assert file in names, file
              assert not any('/node_modules/' in name for name in names)
          PY
          mkdir release-assets
          cp dist/*.tar.gz dist/checksums.txt .release/install.sh .release/docs.json .release/*.vsix release-assets/
          cd release-assets
          sha256sum -c checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fugato-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  acceptance:
    if: github.event_name != 'pull_request'
    needs: package
    uses: ./.github/workflows/acceptance.yml
    with:
      artifact-name: fugato-release-assets

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fugato-release-assets
          path: release-assets
      - name: Create draft prerelease after acceptance passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease \
            --title "Fugato $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
